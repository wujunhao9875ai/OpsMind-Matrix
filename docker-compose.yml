# ============================================================
# 运维 AI Agent 平台 - 顶层 docker-compose.yml
# Multi-Agent + Harness Engineering 架构
# 一键部署: docker compose up -d
# 生产环境: docker compose --env-file .env up -d
# ============================================================

services:
  # ============================================================
  # Harness 基础设施层
  # ============================================================

  consul:
    image: hashicorp/consul:1.20.2
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    volumes:
      - ./orchestrator/consul/consul-config.json:/consul/config/config.json
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./orchestrator/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./orchestrator/nginx/ssl:/etc/nginx/ssl:ro
    # 删除默认冲突配置，避免 server_name localhost 优先生效导致 API 404
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on:
      orchestrator:
        condition: service_started
    networks:
      - agent-network

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis-demo-pwd}
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-demo-pwd}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # Orchestrator（协调器 - 统一入口）
  # ============================================================

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      - LOCAL_MODE=0
      - DATABASE_URL=postgresql+asyncpg://orchestrator:${ORCHESTRATOR_DB_PASSWORD:-orchestrator123}@orchestrator-db:5432/orchestrator_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis-demo-pwd}
      - CONSUL_URL=http://consul:8500
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-domain.com}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator-db:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  orchestrator-db:
    image: postgres:17
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: orchestrator_db
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:-orchestrator123}
    volumes:
      - orchestrator_db_data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # 项目1：Ops Agent（智能运维客服 MCP Server）
  # ============================================================

  ops-agent:
    build: ./ops-agent
    ports:
      - "8100:8000"
    environment:
      - LOCAL_MODE=0
      - DATABASE_URL=postgresql+asyncpg://opsagent:${OPS_DB_PASSWORD:-opsagent123}@ops-db:5432/ops_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
      - EMBEDDING_DIM=4096
      - VLLM_URL=http://vllm:8000
      - CONSUL_URL=http://consul:8500
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen3-32B}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      - RERANKER_MODEL=${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  ops-db:
    image: pgvector/pgvector:pg17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ops_db
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: ${OPS_DB_PASSWORD:-opsagent123}
    volumes:
      - ops_db_data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent -d ops_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # 项目2：Dispatch Agent（自动派单 MCP Server）
  # ============================================================

  dispatch-agent:
    build: ./dispatch-agent
    ports:
      - "8200:8000"
    environment:
      - LOCAL_MODE=0
      - DATABASE_URL=postgresql+asyncpg://dispatch:${DISPATCH_DB_PASSWORD:-dispatch123}@dispatch-db:5432/dispatch_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
      - CONSUL_URL=http://consul:8500
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  dispatch-db:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dispatch_db
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${DISPATCH_DB_PASSWORD:-dispatch123}
    volumes:
      - dispatch_db_data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # 项目3：Warehouse Agent（库房管理 MCP Server）
  # ============================================================

  warehouse-agent:
    build: ./warehouse-agent
    ports:
      - "8300:8000"
    environment:
      - LOCAL_MODE=0
      - DATABASE_URL=postgresql+asyncpg://warehouse:${WAREHOUSE_DB_PASSWORD:-warehouse123}@warehouse-db:5432/warehouse_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
      - PADDLEOCR_URL=http://paddleocr:8866
      - CONSUL_URL=http://consul:8500
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  warehouse-db:
    image: postgres:17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse123}
    volumes:
      - warehouse_db_data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # 项目4：AI 数据中台（Data Platform MCP Server）
  # ============================================================

  data-platform:
    build: ./data-platform
    ports:
      - "8400:8000"
    environment:
      - LOCAL_MODE=0
      - DATABASE_URL=postgresql+asyncpg://dataplatform:${DATAPLATFORM_DB_PASSWORD:-dataplatform123}@dataplatform-db:5432/data_platform_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - VLLM_URL=http://vllm:8000
      - CONSUL_URL=http://consul:8500
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      consul:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  dataplatform-db:
    image: postgres:17
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: data_platform_db
      POSTGRES_USER: dataplatform
      POSTGRES_PASSWORD: ${DATAPLATFORM_DB_PASSWORD:-dataplatform123}
    volumes:
      - dataplatform_db_data:/var/lib/postgresql/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataplatform -d data_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # 模型服务：vLLM（OpenAI 兼容 API，需 NVIDIA GPU）
  # ============================================================

  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8002:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-qwen2.5-7b}
      --dtype auto
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --port 8000
      --host 0.0.0.0
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  paddleocr:
    build: ./paddleocr
    image: mysite-paddleocr:latest
    ports:
      - "8866:8866"
    networks:
      - agent-network

  # ============================================================
  # 项目6：模型微调（框架，不实际训练）
  # ============================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - agent-network

  # ============================================================
  # 前端（统一入口）
  # ============================================================

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - agent-network

  # ============================================================
  # Celery Workers（异步任务）
  # ============================================================

  ops-celery-worker:
    build: ./ops-agent
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ops
    environment:
      - DATABASE_URL=postgresql+asyncpg://opsagent:${OPS_DB_PASSWORD:-opsagent123}@ops-db:5432/ops_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

  dispatch-celery-worker:
    build: ./dispatch-agent
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q dispatch
    environment:
      - DATABASE_URL=postgresql+asyncpg://dispatch:${DISPATCH_DB_PASSWORD:-dispatch123}@dispatch-db:5432/dispatch_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

  dispatch-celery-beat:
    build: ./dispatch-agent
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://dispatch:${DISPATCH_DB_PASSWORD:-dispatch123}@dispatch-db:5432/dispatch_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

  warehouse-celery-worker:
    build: ./warehouse-agent
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q warehouse
    environment:
      - DATABASE_URL=postgresql+asyncpg://warehouse:${WAREHOUSE_DB_PASSWORD:-warehouse123}@warehouse-db:5432/warehouse_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

  dataplatform-celery-collector:
    build: ./data-platform
    command: celery -A app.tasks.celery_app worker -Q data_collect_celery --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://dataplatform:${DATAPLATFORM_DB_PASSWORD:-dataplatform123}@dataplatform-db:5432/data_platform_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

  dataplatform-celery-beat:
    build: ./data-platform
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://dataplatform:${DATAPLATFORM_DB_PASSWORD:-dataplatform123}@dataplatform-db:5432/data_platform_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis-demo-pwd}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-network

  # ============================================================
  # 可观测性：Prometheus + Grafana
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.3.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - agent-network

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-grafana-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - agent-network
    depends_on:
      - prometheus

# ============================================================
# Volumes
# ============================================================

volumes:
  orchestrator_db_data:
  ops_db_data:
  dispatch_db_data:
  warehouse_db_data:
  dataplatform_db_data:
  minio_data:
  vllm_cache:
  mlflow_data:
  prometheus_data:
  grafana_data:

# ============================================================
# Networks
# ============================================================

networks:
  agent-network:
    driver: bridge