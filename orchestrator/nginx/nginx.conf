# ============================================================
# 运维 AI 平台 - Nginx 反向代理配置
# 统一入口：路由到前端 + Orchestrator + 各 Agent
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Docker DNS resolver（运行时解析，避免启动时 upstream 不可用导致崩溃）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ============================================================
    # HTTP -> HTTPS 重定向（生产环境启用）
    # ============================================================
    server {
        listen 80;
        server_name _;

        # 前端静态资源
        location / {
            set $frontend_upstream frontend:80;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Orchestrator API（统一入口）
        location /api/ {
            set $orchestrator_upstream orchestrator:8000;
            proxy_pass http://$orchestrator_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        # WebSocket
        location /ws/ {
            set $orchestrator_ws orchestrator:8000;
            proxy_pass http://$orchestrator_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 健康检查
        location /health {
            set $orchestrator_health orchestrator:8000;
            proxy_pass http://$orchestrator_health;
        }
    }
}